[package]
name = "quarry-connector-mssql"
description = "Connecteur SQL Server / Azure SQL pour Quarry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "quarry-connector-mssql"
path = "src/main.rs"

[dependencies]
quarry-connector-sdk = { workspace = true }
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio = { workspace = true, features = ["net"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { workspace = true }
async-trait = { workspace = true }
