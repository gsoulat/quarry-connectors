# À chaque tag `v*` : compile chaque connecteur pour macOS (Apple Silicon et
# Intel), Linux et Windows, calcule les empreintes SHA-256 et publie le tout,
# avec un `registry.json`, dans la Release GitHub. Quarry lit
# `releases/latest/download/registry.json` pour savoir quoi télécharger.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CONNECTORS: postgres mysql bigquery duckdb clickhouse mssql snowflake

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-14, target: x86_64-apple-darwin, ext: "" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Compilation
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Collecte des binaires
        shell: bash
        run: |
          mkdir -p dist
          for c in $CONNECTORS; do
            cp "target/${{ matrix.target }}/release/quarry-connector-$c${{ matrix.ext }}" \
               "dist/quarry-connector-$c-${{ matrix.target }}${{ matrix.ext }}"
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  publish:
    name: Registre et Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: registry.json
        shell: bash
        run: |
          python3 scripts/make_registry.py "${{ github.ref_name }}" "${{ github.repository }}" dist > dist/registry.json
          cat dist/registry.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
