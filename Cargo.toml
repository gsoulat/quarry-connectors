[workspace]
resolver = "2"
members = ["protocol", "sdk", "connectors/postgres", "connectors/mysql", "connectors/bigquery", "connectors/duckdb", "connectors/clickhouse", "connectors/mssql", "connectors/snowflake"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gsoulat/quarry-connectors"

[workspace.dependencies]
quarry-protocol = { path = "protocol" }
quarry-connector-sdk = { path = "sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
async-trait = "0.1"
futures-util = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }

# Connecteurs aussi petits que possible.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[profile.release.build-override]
strip = false
